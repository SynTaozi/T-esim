<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo F — 热门目的地画廊（参考 Holafly）</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--accent:#003ec7;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#fff}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
    .banner{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 18px;background:#0f172a;color:#cbd5e1;font-size:13px}
    .banner a{color:#94a3b8;text-decoration:none;padding:4px 10px;border-radius:999px}.banner a.active,.banner a:hover{color:#fff;background:var(--accent)}
    .banner nav{display:flex;flex-wrap:wrap;gap:6px}
    .hero{padding:48px 20px 28px;background:radial-gradient(900px 320px at 20% -10%, rgba(0,62,199,.16), transparent),linear-gradient(180deg,#eef3ff,#fff 70%)}
    .hero-inner{max-width:1080px;margin:0 auto;text-align:center}
    h1{margin:0 0 10px;font:800 42px/1.1 Manrope,system-ui;letter-spacing:-.03em}
    .hero p{margin:0 auto 22px;max-width:560px;color:var(--muted)}
    .finder{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:720px;margin:0 auto}
    .finder input,.finder select{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;background:#fff;min-width:180px}
    .finder input{flex:1;min-width:220px}
    .finder button{height:48px;border:0;border-radius:12px;padding:0 20px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
    .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
    .tabs{display:flex;justify-content:center;gap:8px;margin-bottom:22px}
    .tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600}
    .tabs button.active{background:rgba(0,62,199,.1);color:var(--accent)}
    .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media(max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)} h1{font-size:32px}}
    @media(max-width:560px){.gallery{grid-template-columns:1fr}}
    .card{position:relative;border-radius:18px;overflow:hidden;min-height:210px;cursor:pointer;color:#fff;isolation:isolate}
    .card .bg{position:absolute;inset:0;background:linear-gradient(145deg,var(--c1),var(--c2));z-index:-2}
    .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55));z-index:-1}
    .card .body{position:absolute;left:16px;right:16px;bottom:16px}
    .card h3{margin:0 0 4px;font:700 20px Manrope,system-ui}
    .card p{margin:0;font-size:13px;opacity:.9}
    .panel{display:none;margin-top:28px;border:1px solid var(--line);border-radius:18px;padding:18px}
    .panel.show{display:block}
    .days{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
    .days button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}
    .days button.active{border-color:var(--accent);background:rgba(0,62,199,.08);color:var(--accent)}
    .offer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .offer .price{font:800 28px Manrope,system-ui;color:var(--accent)}
    .offer button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="banner">
    <div><strong style="color:#fff">Demo F</strong> · 热门目的地画廊（参考 Holafly：大搜索 + 热门卡片 + 天数选择）</div>
    <nav>
      <a href="index.html">Index</a>
      <a href="products-filter-d-airalo.html">D Airalo</a>
      <a href="products-filter-e-nomad.html">E Nomad</a>
      <a class="active" href="products-filter-f-holafly.html">F Holafly</a>
      <a href="products-filter-g-minimal.html">G Minimal</a>
    </nav>
  </div>
  <section class="hero">
    <div class="hero-inner">
      <h1>Where are you traveling next?</h1>
      <p>先选目的地和天数，页面不放左侧功能筛选；产品类型用顶部轻量切换。</p>
      <div class="finder">
        <input id="q" placeholder="Destination" />
        <select id="kind"><option value="all">All products</option><option value="esim">Data eSIM</option><option value="phone">Phone number</option></select>
        <button type="button">Find plan</button>
      </div>
    </div>
  </section>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div class="gallery" id="gallery"></div>
    <div class="panel" id="panel">
      <h2 id="panelTitle" style="margin:0;font:700 22px Manrope,system-ui">Plan</h2>
      <p style="margin:6px 0 0;color:var(--muted)">Choose duration</p>
      <div class="days" id="days"></div>
      <div class="offer">
        <div>
          <div class="price" id="price">$0</div>
          <div style="color:var(--muted);font-size:13px" id="offerMeta">Unlimited / data plan mock</div>
        </div>
        <button type="button">Continue</button>
      </div>
    </div>
  </div>
  <script>
    const tabs=['Popular','Asia','Europe','America'];
    const cards=[
      {name:'Japan',tab:'Asia',kind:'esim',c1:'#1d4ed8',c2:'#60a5fa',base:6.5},
      {name:'Thailand',tab:'Asia',kind:'esim',c1:'#0f766e',c2:'#5eead4',base:5.5},
      {name:'Hong Kong Number',tab:'Asia',kind:'phone',c1:'#7c3aed',c2:'#c4b5fd',base:12.5},
      {name:'Europe',tab:'Europe',kind:'esim',c1:'#0369a1',c2:'#7dd3fc',base:14},
      {name:'USA Number',tab:'America',kind:'phone',c1:'#b91c1c',c2:'#fda4af',base:19},
      {name:'USA Data',tab:'America',kind:'esim',c1:'#1e3a8a',c2:'#93c5fd',base:9}
    ];
    const dayOpts=[5,7,15,30];
    let tab='Popular', kind='all', q='', selected=null, days=7;
    function render(){
      document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-t="${t}">${t}</button>`).join('');
      document.getElementById('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
      const list=cards.filter(c=>{
        if(tab!=='Popular' && c.tab!==tab) return false;
        if(kind!=='all' && c.kind!==kind) return false;
        if(q && !c.name.toLowerCase().includes(q)) return false;
        return true;
      });
      document.getElementById('gallery').innerHTML=list.map(c=>`
        <article class="card" style="--c1:${c.c1};--c2:${c.c2}" data-n="${c.name}">
          <div class="bg"></div>
          <div class="body"><h3>${c.name}</h3><p>${c.kind==='phone'?'Phone number':'Unlimited-style data mock'}</p></div>
        </article>`).join('');
      document.getElementById('gallery').querySelectorAll('.card').forEach(el=>el.onclick=()=>{selected=el.dataset.n;renderPanel();});
      renderPanel();
    }
    function renderPanel(){
      const panel=document.getElementById('panel');
      if(!selected){panel.classList.remove('show');return;}
      panel.classList.add('show');
      const card=cards.find(c=>c.name===selected);
      document.getElementById('panelTitle').textContent=selected;
      document.getElementById('days').innerHTML=dayOpts.map(d=>`<button class="${d===days?'active':''}" data-d="${d}">${d} days</button>`).join('');
      document.getElementById('days').querySelectorAll('button').forEach(b=>b.onclick=()=>{days=+b.dataset.d;renderPanel();});
      const price=(card.base*(days/7)).toFixed(2);
      document.getElementById('price').textContent='$'+price;
      document.getElementById('offerMeta').textContent=card.kind==='phone'?`${days} 天号码服务（示意）`:`${days} 天数据套餐（示意）`;
    }
    document.getElementById('q').oninput=e=>{q=e.target.value.trim().toLowerCase();render();};
    document.getElementById('kind').onchange=e=>{kind=e.target.value;render();};
    render();
  </script>
</body>
</html>
