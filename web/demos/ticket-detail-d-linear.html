<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工单详情 · D · Linear 式紧凑详情</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #e8eaed;
      --muted: #9aa0a6;
      --line: #2a2f36;
      --panel: #16181d;
      --bg: #0f1115;
      --brand: #5e6ad2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    .badge {
      position: fixed; top: 12px; right: 12px; z-index: 5;
      background: #fff; color: #111; font-size: 11px; font-weight: 700;
      padding: 5px 9px; border-radius: 8px;
    }
    .wrap { max-width: 860px; margin: 40px auto; padding: 0 16px 60px; }
    .crumb { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    }
    .head { padding: 22px 22px 16px; border-bottom: 1px solid var(--line); }
    .head h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: -0.02em; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .chip {
      font-size: 12px; padding: 4px 8px; border-radius: 6px;
      border: 1px solid var(--line); color: var(--muted);
    }
    .chip.on { color: #86efac; border-color: #14532d; background: rgba(20,83,45,.25); }
    .props {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      padding: 14px 22px; border-bottom: 1px solid var(--line); font-size: 12px;
    }
    .props span { display: block; color: var(--muted); margin-bottom: 4px; }
    .props strong { font-weight: 600; color: var(--ink); }
    .feed { padding: 8px 0; }
    .ev {
      display: grid; grid-template-columns: 42px 1fr; gap: 12px;
      padding: 14px 22px; border-bottom: 1px solid var(--line);
    }
    .ev:last-child { border-bottom: 0; }
    .dot {
      width: 28px; height: 28px; border-radius: 8px; background: #2a2f36;
      display: grid; place-items: center; font-size: 11px; font-weight: 700;
    }
    .dot.s { background: var(--brand); }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .txt { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    .imgs { display: flex; gap: 8px; margin-top: 10px; }
    .imgs img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); }
    .composer { padding: 16px 22px 20px; border-top: 1px solid var(--line); }
    textarea {
      width: 100%; min-height: 90px; border-radius: 10px; border: 1px solid var(--line);
      background: #0f1115; color: var(--ink); padding: 12px; font: inherit; outline: none; resize: vertical;
    }
    textarea:focus { border-color: var(--brand); }
    .actions { margin-top: 10px; display: flex; justify-content: flex-end; gap: 8px; }
    .btn {
      height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
      background: transparent; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn.primary { background: var(--brand); border-color: var(--brand); }
    @media (max-width: 720px) { .props { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="badge">D · Linear 式</div>
  <div class="wrap">
    <div class="crumb">工单 / TK1731400123456</div>
    <div class="card">
      <div class="head">
        <h1>eSIM 激活二维码无法扫描</h1>
        <div class="row">
          <span class="chip on">Open</span>
          <span class="chip">High</span>
          <span class="chip">Tech</span>
        </div>
      </div>
      <div class="props">
        <div><span>工单号</span><strong>TK1731…</strong></div>
        <div><span>订单</span><strong>T17ABC</strong></div>
        <div><span>创建</span><strong>11-12 10:20</strong></div>
        <div><span>更新</span><strong>11-12 10:48</strong></div>
      </div>
      <div class="feed">
        <div class="ev">
          <div class="dot">U</div>
          <div>
            <div class="meta">用户 · 10:20</div>
            <div class="txt">扫码失败，请协助。</div>
            <div class="imgs">
              <img src="https://placehold.co/160x160/2a2f36/9aa0a6?text=QR" alt="" />
            </div>
          </div>
        </div>
        <div class="ev">
          <div class="dot s">A</div>
          <div>
            <div class="meta">客服 Amy · 10:35</div>
            <div class="txt">已核对，可重新下发激活码。</div>
          </div>
        </div>
      </div>
      <div class="composer">
        <textarea placeholder="写下回复…"></textarea>
        <div class="actions">
          <button class="btn" type="button">关闭</button>
          <button class="btn primary" type="button">回复</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
