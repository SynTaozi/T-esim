<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>订单查询 · A · Soft brand hero</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f7f4;
      --ink: #10231a;
      --muted: #5b6f64;
      --line: #d7e4dc;
      --brand: #0f7a4c;
      --brand-soft: #e6f4ec;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .logo { font-weight: 700; letter-spacing: -0.02em; }
    .top nav { display: flex; gap: 18px; color: var(--muted); font-size: 14px; }
    .hero {
      position: relative;
      overflow: hidden;
      padding: 56px 20px 72px;
      background:
        radial-gradient(900px 420px at 15% -10%, #c8edd8 0%, transparent 55%),
        radial-gradient(700px 380px at 90% 0%, #d9f0e4 0%, transparent 50%),
        linear-gradient(180deg, #eef7f1 0%, var(--bg) 100%);
    }
    .hero-inner {
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.7);
      border: 1px solid var(--line);
      color: var(--brand);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .eyebrow i {
      width: 7px; height: 7px; border-radius: 50%; background: var(--brand);
    }
    h1 {
      margin: 0 0 10px;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(30px, 5vw, 40px);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    .sub {
      margin: 0 auto 28px;
      max-width: 420px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
    .card {
      text-align: left;
      background: var(--card);
      border: 1px solid rgba(15,122,76,.12);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(16,35,26,.06);
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #33453c;
    }
    input {
      width: 100%;
      height: 48px;
      border: 1px solid #cfdcd4;
      border-radius: 12px;
      padding: 0 14px;
      font: inherit;
      font-size: 15px;
      outline: none;
      background: #fbfdfc;
    }
    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15,122,76,.12);
      background: #fff;
    }
    .btn {
      margin-top: 14px;
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.05); }
    .tip {
      margin: 12px 0 0;
      font-size: 12.5px;
      color: #7a8d83;
      line-height: 1.5;
    }
    .trust {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    .trust span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .badge {
      position: absolute;
      top: 14px; right: 14px;
      background: #10231a; color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 5px 9px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="badge">A · Soft brand hero</div>
  <header class="top">
    <div class="logo">Tesim</div>
    <nav><span>产品</span><span>订单查询</span><span>支持</span></nav>
  </header>
  <section class="hero">
    <div class="hero-inner">
      <div class="eyebrow"><i></i> Guest order lookup</div>
      <h1>查找你的订单</h1>
      <p class="sub">输入下单邮箱，即可查看该邮箱下的全部订单、物流与 eSIM 激活信息。</p>
      <div class="card">
        <label for="email">下单邮箱</label>
        <input id="email" type="email" placeholder="下单时填写的邮箱" />
        <button class="btn" type="button">查询订单</button>
        <p class="tip">使用下单邮箱即可查询；多笔订单会以列表展示。登录用户也可在「我的订单」中查看。</p>
      </div>
      <div class="trust">
        <span>🔒 仅展示该邮箱订单</span>
        <span>⚡ 即时查询</span>
        <span>📧 无需登录</span>
      </div>
    </div>
  </section>
</body>
</html>
