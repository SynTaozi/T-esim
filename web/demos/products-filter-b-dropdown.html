<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo B — 工具栏下拉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #003ec7;
      --accent-soft: rgba(0, 62, 199, 0.08);
      --text: #131b2e;
      --muted: #434656;
      --elevated: #f2f3ff;
      --border: #c3c5d9;
      --card: #ffffff;
      --bg: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .demo-banner {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
    }
    .demo-banner strong { color: #fff; }
    .demo-banner nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .demo-banner a {
      color: #94a3b8;
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
    }
    .demo-banner a:hover { color: #fff; }
    .demo-banner a.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }
    .page {
      max-width: 1300px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }
    .hero h1 {
      margin: 0 0 12px;
      font-family: Manrope, system-ui, sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .hero h1 span { color: var(--accent); }
    .hero p {
      margin: 0 0 40px;
      max-width: 640px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }
    .controls { display: flex; flex-direction: column; gap: 20px; margin-bottom: 36px; }
    .region-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
      scrollbar-width: none;
    }
    .region-bar::-webkit-scrollbar { display: none; }
    .region-tab, .type-tab {
      border: none;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: 0.15s ease;
    }
    .region-tab {
      padding: 8px 18px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }
    .region-tab:hover { background: var(--accent-soft); color: var(--accent); }
    .region-tab.active { background: var(--accent); color: #fff; font-weight: 700; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(180deg, #fff, var(--elevated));
    }
    .type-tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
    }
    .type-tab {
      padding: 7px 14px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }
    .type-tab:hover { color: var(--accent); }
    .type-tab.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .divider {
      width: 1px;
      height: 28px;
      background: color-mix(in srgb, var(--border) 80%, transparent);
    }
    .dd {
      position: relative;
      min-width: 180px;
    }
    .dd-btn {
      width: 100%;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .dd-btn:hover, .dd.open .dd-btn {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 12%, transparent);
    }
    .dd-btn .label { color: var(--muted); font-size: 12px; margin-right: 4px; }
    .dd-btn .value { font-weight: 600; }
    .dd-btn svg { width: 14px; height: 14px; color: var(--muted); transition: transform 0.2s; }
    .dd.open .dd-btn svg { transform: rotate(180deg); }
    .dd-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 20;
      display: none;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
    }
    .dd.open .dd-menu { display: block; }
    .dd-item {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 9px 10px;
      border-radius: 7px;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }
    .dd-item:hover { background: var(--accent-soft); color: var(--accent); }
    .dd-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }
    .search {
      position: relative;
      flex: 1;
      min-width: 160px;
      max-width: 280px;
      margin-left: auto;
    }
    .search input {
      width: 100%;
      height: 40px;
      padding: 0 14px 0 38px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font: inherit;
      color: var(--text);
      outline: none;
    }
    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 15%, transparent);
    }
    .search svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }
    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 28px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }
    .pill button {
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
    }
    .meta {
      margin: 0 0 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 32px; }
      .divider { display: none; }
      .search { max-width: none; flex: 1 1 100%; margin-left: 0; }
      .dd { flex: 1 1 100%; }
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(195, 197, 217, 0.35);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }
    .card-img {
      height: 140px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-soft), #e8f4ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin-bottom: 16px;
    }
    .card h3 {
      margin: 0 0 8px;
      font-family: Manrope, system-ui, sans-serif;
      font-size: 20px;
      font-weight: 700;
    }
    .card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; min-height: 28px; }
    .card .tag {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      background: rgba(0, 89, 181, 0.06);
      border: 1px solid rgba(0, 89, 181, 0.12);
    }
    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid rgba(195, 197, 217, 0.4);
    }
    .price { font-size: 18px; font-weight: 700; }
    .price small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="demo-banner">
    <div><strong>Demo B</strong> · 工具栏下拉（类型 + 二级分类下拉 + 搜索同一行）</div>
    <nav>
      <a href="products-filter-a-chips.html">A Chip</a>
      <a class="active" href="products-filter-b-dropdown.html">B Dropdown</a>
      <a href="products-filter-c-sidebar.html">C Sidebar</a>
    </nav>
  </div>

  <div class="page">
    <section class="hero">
      <h1>Explore destinations <span>Simplified.</span></h1>
      <p>Stay connected worldwide with local numbers and data plans. This demo only shows filter layout.</p>
    </section>

    <div class="controls">
      <div class="region-bar" id="regions"></div>
      <div class="toolbar">
        <div class="type-tabs" id="types"></div>
        <div class="divider"></div>
        <div class="dd" id="subDd">
          <button type="button" class="dd-btn" id="subBtn">
            <span><span class="label">功能</span><span class="value" id="subValue">全部</span></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="dd-menu" id="subMenu"></div>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
          <input id="search" type="search" placeholder="搜索产品…" />
        </div>
      </div>
      <div class="active-filters" id="pills"></div>
    </div>

    <p class="meta" id="meta"></p>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const regions = ['全部', '亚洲', '欧洲', '美洲', '全球'];
    const types = [
      { id: 'phone', name: '手机号卡', subs: ['全部', '接码', '语音', '长期号'] },
      { id: 'esim', name: '流量 eSIM', subs: ['全部', '日韩', '欧美', '全球通'] }
    ];
    const products = [
      { id: 1, type: 'phone', sub: '接码', region: '亚洲', name: '日本接码号', flag: '🇯🇵', countries: ['日本'], price: 9.9 },
      { id: 2, type: 'phone', sub: '语音', region: '亚洲', name: '香港语音号', flag: '🇭🇰', countries: ['香港'], price: 12.5 },
      { id: 3, type: 'phone', sub: '长期号', region: '美洲', name: '美国长期号', flag: '🇺🇸', countries: ['美国'], price: 19 },
      { id: 4, type: 'esim', sub: '日韩', region: '亚洲', name: '日本 7天 3GB', flag: '🇯🇵', countries: ['日本'], price: 6.5 },
      { id: 5, type: 'esim', sub: '欧美', region: '欧洲', name: '欧洲 15天 10GB', flag: '🇪🇺', countries: ['德', '法', '意'], price: 14 },
      { id: 6, type: 'esim', sub: '全球通', region: '全球', name: '全球 30天 20GB', flag: '🌍', countries: ['全球'], price: 29 }
    ];

    const state = { region: '全部', type: 'phone', sub: '全部', q: '' };

    function currentSubs() {
      return types.find((t) => t.id === state.type)?.subs || ['全部'];
    }

    function filtered() {
      return products.filter((p) => {
        if (p.type !== state.type) return false;
        if (state.region !== '全部' && p.region !== state.region) return false;
        if (state.sub !== '全部' && p.sub !== state.sub) return false;
        if (state.q && !p.name.toLowerCase().includes(state.q.toLowerCase())) return false;
        return true;
      });
    }

    function renderRegions() {
      const el = document.getElementById('regions');
      el.innerHTML = regions.map((r) =>
        `<button class="region-tab${state.region === r ? ' active' : ''}" data-id="${r}">${r}</button>`
      ).join('');
      el.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.region = btn.dataset.id;
          render();
        });
      });
    }

    function renderTypes() {
      const el = document.getElementById('types');
      el.innerHTML = types.map((t) =>
        `<button class="type-tab${state.type === t.id ? ' active' : ''}" data-id="${t.id}">${t.name}</button>`
      ).join('');
      el.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.type = btn.dataset.id;
          state.sub = '全部';
          render();
        });
      });
    }

    function renderDropdown() {
      document.getElementById('subValue').textContent = state.sub;
      const menu = document.getElementById('subMenu');
      menu.innerHTML = currentSubs().map((s) =>
        `<button type="button" class="dd-item${state.sub === s ? ' active' : ''}" data-id="${s}">${s}</button>`
      ).join('');
      menu.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.sub = btn.dataset.id;
          document.getElementById('subDd').classList.remove('open');
          render();
        });
      });
    }

    function renderPills() {
      const pills = [];
      if (state.region !== '全部') pills.push(['region', state.region]);
      if (state.sub !== '全部') pills.push(['sub', state.sub]);
      const el = document.getElementById('pills');
      if (!pills.length) {
        el.innerHTML = '';
        return;
      }
      el.innerHTML = pills.map(([key, label]) =>
        `<span class="pill">${label}<button type="button" data-key="${key}" aria-label="清除">×</button></span>`
      ).join('');
      el.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (btn.dataset.key === 'region') state.region = '全部';
          if (btn.dataset.key === 'sub') state.sub = '全部';
          render();
        });
      });
    }

    function renderGrid() {
      const list = filtered();
      document.getElementById('meta').textContent = `共 ${list.length} 个产品 · 当前：${state.type} / ${state.region} / ${state.sub}`;
      const grid = document.getElementById('grid');
      if (!list.length) {
        grid.innerHTML = '<div class="empty">暂无匹配产品</div>';
        return;
      }
      grid.innerHTML = list.map((p) => `
        <article class="card">
          <div class="card-img">${p.flag}</div>
          <h3>${p.name}</h3>
          <div class="tags">${p.countries.map((c) => `<span class="tag">${c}</span>`).join('')}<span class="tag">${p.sub}</span></div>
          <div class="card-foot">
            <div class="price"><small>套餐费</small>$${p.price}</div>
            <div class="btn">查看套餐</div>
          </div>
        </article>
      `).join('');
    }

    function render() {
      renderRegions();
      renderTypes();
      renderDropdown();
      renderPills();
      renderGrid();
    }

    document.getElementById('subBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('subDd').classList.toggle('open');
    });
    document.addEventListener('click', () => {
      document.getElementById('subDd').classList.remove('open');
    });
    document.getElementById('subDd').addEventListener('click', (e) => e.stopPropagation());

    document.getElementById('search').addEventListener('input', (e) => {
      state.q = e.target.value.trim();
      renderGrid();
    });

    render();
  </script>
</body>
</html>
