<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工单详情 · A · Zendesk 式对话流</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6f8;
      --ink: #2f3941;
      --muted: #68737d;
      --line: #d8dcde;
      --brand: #1f73b7;
      --brand-soft: #e9f2fa;
      --user: #fff;
      --agent: #f8f9f9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    .badge {
      position: fixed; top: 12px; right: 12px; z-index: 5;
      background: #111; color: #fff; font-size: 11px; font-weight: 700;
      padding: 5px 9px; border-radius: 8px;
    }
    .shell {
      max-width: 920px; margin: 28px auto 60px; padding: 0 16px;
      display: grid; grid-template-columns: 1fr 280px; gap: 16px;
    }
    .main, .side {
      background: #fff; border: 1px solid var(--line); border-radius: 10px;
    }
    .top {
      padding: 16px 18px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
    }
    .top h1 { margin: 0 0 6px; font-size: 18px; line-height: 1.3; }
    .meta { color: var(--muted); font-size: 12px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
      background: #eef2f4; color: #49545c;
    }
    .tag.open { background: #e8f5e9; color: #2e7d32; }
    .tag.high { background: #fdecea; color: #c62828; }
    .thread { padding: 16px 18px 8px; display: grid; gap: 14px; max-height: 520px; overflow: auto; }
    .msg {
      border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
      background: var(--user);
    }
    .msg.agent { background: var(--agent); }
    .msg-h {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-bottom: 1px solid #edf0f2;
      font-size: 13px;
    }
    .av {
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center; font-size: 11px; font-weight: 700;
      background: #cfd8dc; color: #37474f;
    }
    .msg.agent .av { background: var(--brand); color: #fff; }
    .who { font-weight: 600; }
    .when { margin-left: auto; color: var(--muted); font-size: 12px; }
    .msg-b { padding: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    .imgs { display: flex; gap: 8px; margin-top: 10px; }
    .imgs img {
      width: 88px; height: 88px; object-fit: cover; border-radius: 8px;
      border: 1px solid var(--line); background: #fff;
    }
    .composer {
      border-top: 1px solid var(--line); padding: 14px 18px 16px;
      background: #fafbfc;
    }
    .composer label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
    textarea {
      width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line);
      border-radius: 8px; padding: 10px 12px; font: inherit; outline: none;
    }
    textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(31,115,183,.15); }
    .composer-actions { margin-top: 10px; display: flex; justify-content: flex-end; gap: 8px; }
    .btn {
      border: 0; border-radius: 8px; height: 36px; padding: 0 14px;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
    .btn.primary { background: var(--brand); color: #fff; }
    .side { padding: 14px; height: fit-content; }
    .side h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .kv { display: grid; gap: 10px; font-size: 13px; }
    .kv div { display: flex; justify-content: space-between; gap: 8px; }
    .kv span { color: var(--muted); }
    .kv strong { font-weight: 600; text-align: right; }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="badge">A · Zendesk 式</div>
  <div class="shell">
    <section class="main">
      <div class="top">
        <div>
          <h1>eSIM 激活二维码无法扫描</h1>
          <div class="meta">TK1731400123456 · 创建于 2026-11-12 10:20</div>
        </div>
        <div class="tags">
          <span class="tag">技术支持</span>
          <span class="tag high">高优先级</span>
          <span class="tag open">处理中</span>
        </div>
      </div>

      <div class="thread">
        <article class="msg">
          <div class="msg-h"><div class="av">U</div><span class="who">用户</span><span class="when">10:20</span></div>
          <div class="msg-b">你好，我购买的日本 eSIM 二维码扫不出来，手机提示无效。订单号 T17ABC。
            <div class="imgs">
              <img src="https://placehold.co/176x176/e2e8f0/64748b?text=QR" alt="截图" />
              <img src="https://placehold.co/176x176/e2e8f0/64748b?text=Error" alt="报错" />
            </div>
          </div>
        </article>
        <article class="msg agent">
          <div class="msg-h"><div class="av">S</div><span class="who">客服 · Amy</span><span class="when">10:35</span></div>
          <div class="msg-b">收到，已核对订单。请确认手机系统时间正确，并用系统相机重新扫描。若仍失败，我可以重新下发激活码。</div>
        </article>
        <article class="msg">
          <div class="msg-h"><div class="av">U</div><span class="who">用户</span><span class="when">10:48</span></div>
          <div class="msg-b">时间没问题，还是扫不了，麻烦重新发一下。</div>
        </article>
      </div>

      <div class="composer">
        <label>公开回复</label>
        <textarea placeholder="输入回复内容，发送后用户可见，并触发邮件通知…"></textarea>
        <div class="composer-actions">
          <button class="btn ghost" type="button">关闭工单</button>
          <button class="btn primary" type="button">发送回复</button>
        </div>
      </div>
    </section>

    <aside class="side">
      <h2>工单属性</h2>
      <div class="kv">
        <div><span>状态</span><strong>OPEN</strong></div>
        <div><span>优先级</span><strong>HIGH</strong></div>
        <div><span>分类</span><strong>TECH</strong></div>
        <div><span>关联订单</span><strong>T17ABC</strong></div>
        <div><span>用户 ID</span><strong>1024</strong></div>
        <div><span>更新时间</span><strong>10:48</strong></div>
      </div>
    </aside>
  </div>
</body>
</html>
