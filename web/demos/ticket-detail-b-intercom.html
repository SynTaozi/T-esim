<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工单详情 · B · Intercom 式聊天气泡</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #0057ff;
      --bg: #f3f4f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Inter, system-ui, sans-serif; color: var(--ink);
      background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 40%);
    }
    .badge {
      position: fixed; top: 12px; right: 12px; z-index: 5;
      background: #111; color: #fff; font-size: 11px; font-weight: 700;
      padding: 5px 9px; border-radius: 8px;
    }
    .card {
      max-width: 720px; margin: 36px auto; background: #fff;
      border-radius: 20px; border: 1px solid var(--line);
      box-shadow: 0 20px 50px rgba(15,23,42,.08);
      overflow: hidden; display: flex; flex-direction: column; min-height: 680px;
    }
    .header {
      padding: 18px 20px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .header h1 { margin: 0; font-size: 16px; }
    .header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .pill {
      font-size: 12px; font-weight: 700; color: #065f46;
      background: #d1fae5; padding: 6px 10px; border-radius: 999px;
    }
    .chat {
      flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 14px;
      background: #fafafa; overflow: auto;
    }
    .row { display: flex; gap: 10px; align-items: flex-end; max-width: 88%; }
    .row.me { align-self: flex-end; flex-direction: row-reverse; }
    .av {
      width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
      background: #dbeafe; color: #1d4ed8;
    }
    .row.me .av { background: #111827; color: #fff; }
    .bubble {
      background: #fff; border: 1px solid var(--line); border-radius: 16px 16px 16px 4px;
      padding: 12px 14px; font-size: 14px; line-height: 1.55;
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }
    .row.me .bubble {
      background: var(--brand); color: #fff; border-color: transparent;
      border-radius: 16px 16px 4px 16px;
    }
    .time { margin-top: 4px; font-size: 11px; color: var(--muted); }
    .row.me .time { text-align: right; color: #c7d2fe; }
    .thumbs { display: flex; gap: 6px; margin-top: 8px; }
    .thumbs img { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; }
    .composer {
      padding: 14px; border-top: 1px solid var(--line); background: #fff;
      display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end;
    }
    textarea {
      width: 100%; min-height: 72px; border: 1px solid var(--line); border-radius: 14px;
      padding: 12px; font: inherit; resize: none; outline: none;
    }
    textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(0,87,255,.12); }
    .send {
      height: 44px; padding: 0 18px; border: 0; border-radius: 12px;
      background: var(--brand); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="badge">B · Intercom 式</div>
  <div class="card">
    <div class="header">
      <div>
        <h1>eSIM 激活二维码无法扫描</h1>
        <p>TK1731400123456 · 技术支持</p>
      </div>
      <span class="pill">OPEN</span>
    </div>
    <div class="chat">
      <div class="row">
        <div class="av">U</div>
        <div>
          <div class="bubble">二维码扫不出来，附上截图。
            <div class="thumbs">
              <img src="https://placehold.co/144x144/e2e8f0/64748b?text=1" alt="" />
              <img src="https://placehold.co/144x144/e2e8f0/64748b?text=2" alt="" />
            </div>
          </div>
          <div class="time">10:20</div>
        </div>
      </div>
      <div class="row me">
        <div class="av">S</div>
        <div>
          <div class="bubble">已收到，我先帮你核对订单状态。</div>
          <div class="time">10:35</div>
        </div>
      </div>
      <div class="row">
        <div class="av">U</div>
        <div>
          <div class="bubble">好的，麻烦尽快。</div>
          <div class="time">10:48</div>
        </div>
      </div>
    </div>
    <div class="composer">
      <textarea placeholder="输入回复…"></textarea>
      <button class="send" type="button">发送</button>
    </div>
  </div>
</body>
</html>
