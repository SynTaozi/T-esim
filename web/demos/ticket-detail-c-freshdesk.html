<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工单详情 · C · Freshdesk 式工作台</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #12344d;
      --muted: #475867;
      --line: #cfd7df;
      --brand: #2c5cc5;
      --bg: #ebeff3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    .badge {
      position: fixed; top: 12px; right: 12px; z-index: 5;
      background: #111; color: #fff; font-size: 11px; font-weight: 700;
      padding: 5px 9px; border-radius: 8px;
    }
    .bar {
      background: #fff; border-bottom: 1px solid var(--line);
      padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .bar strong { font-size: 15px; }
    .bar .acts { display: flex; gap: 8px; }
    .btn {
      height: 34px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line);
      background: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .layout {
      max-width: 1100px; margin: 16px auto 40px; padding: 0 16px;
      display: grid; grid-template-columns: 1fr 300px; gap: 14px;
    }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; }
    .title {
      padding: 16px 18px; border-bottom: 1px solid var(--line);
    }
    .title h1 { margin: 0 0 8px; font-size: 20px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #eef2f7; color: var(--muted);
    }
    .chip.ok { background: #e5f8ef; color: #0b6e4f; }
    .timeline { padding: 8px 0; }
    .item {
      display: grid; grid-template-columns: 56px 1fr; gap: 0 12px;
      padding: 14px 18px; border-bottom: 1px solid #edf1f5;
    }
    .item:last-child { border-bottom: 0; }
    .clock { font-size: 11px; color: var(--muted); padding-top: 4px; }
    .who { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .body { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    .imgs { display: flex; gap: 8px; margin-top: 8px; }
    .imgs span {
      width: 84px; height: 84px; border-radius: 6px; border: 1px solid var(--line);
      background: #f5f7fa center/cover no-repeat;
    }
    .reply {
      margin: 0 18px 18px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    }
    .reply .tabs {
      display: flex; gap: 0; border-bottom: 1px solid var(--line); background: #f7f9fb;
    }
    .reply .tabs span {
      padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: default;
    }
    .reply .tabs span.on { color: var(--brand); border-bottom: 2px solid var(--brand); background: #fff; }
    textarea {
      width: 100%; min-height: 110px; border: 0; padding: 12px 14px; font: inherit; resize: vertical; outline: none;
    }
    .reply-foot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border-top: 1px solid var(--line); background: #f7f9fb;
    }
    .hint { font-size: 12px; color: var(--muted); }
    .side { padding: 14px; height: fit-content; }
    .side h2 { margin: 0 0 12px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .field .val {
      border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; background: #fafbfc;
    }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="badge">C · Freshdesk 式</div>
  <div class="bar">
    <strong>工单 #TK1731400123456</strong>
    <div class="acts">
      <button class="btn" type="button">关闭</button>
      <button class="btn primary" type="button">发送回复</button>
    </div>
  </div>
  <div class="layout">
    <section class="panel">
      <div class="title">
        <h1>eSIM 激活二维码无法扫描</h1>
        <div class="chips">
          <span class="chip ok">Open</span>
          <span class="chip">High</span>
          <span class="chip">Tech Support</span>
          <span class="chip">订单 T17ABC</span>
        </div>
      </div>
      <div class="timeline">
        <div class="item">
          <div class="clock">10:20</div>
          <div>
            <div class="who">用户</div>
            <div class="body">扫码失败，附截图。</div>
            <div class="imgs">
              <span style="background-image:url('https://placehold.co/168x168/e2e8f0/64748b?text=QR')"></span>
              <span style="background-image:url('https://placehold.co/168x168/e2e8f0/64748b?text=Err')"></span>
            </div>
          </div>
        </div>
        <div class="item">
          <div class="clock">10:35</div>
          <div>
            <div class="who">客服 Amy</div>
            <div class="body">已收到，正在核对发货记录与激活码有效性。</div>
          </div>
        </div>
      </div>
      <div class="reply">
        <div class="tabs"><span class="on">回复</span><span>备注</span></div>
        <textarea placeholder="输入公开回复…"></textarea>
        <div class="reply-foot">
          <span class="hint">发送后将邮件通知用户</span>
          <button class="btn primary" type="button">发送</button>
        </div>
      </div>
    </section>
    <aside class="panel side">
      <h2>详情</h2>
      <div class="field"><label>状态</label><div class="val">OPEN</div></div>
      <div class="field"><label>优先级</label><div class="val">HIGH</div></div>
      <div class="field"><label>分类</label><div class="val">TECH</div></div>
      <div class="field"><label>用户</label><div class="val">user@example.com</div></div>
      <div class="field"><label>创建</label><div class="val">2026-11-12 10:20</div></div>
      <div class="field"><label>更新</label><div class="val">2026-11-12 10:35</div></div>
    </aside>
  </div>
</body>
</html>
