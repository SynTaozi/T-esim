<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>订单查询 · D · Trust card</title>
  <link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap');
    :root {
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #111827;
      --accent: #059669;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 50% -20%, #dbeafe 0%, transparent 55%),
        linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
    }
    .frame {
      max-width: 560px;
      margin: 72px auto;
      padding: 0 16px 80px;
    }
    .card {
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 22px;
      padding: 28px 26px 24px;
      box-shadow:
        0 1px 0 rgba(255,255,255,.8) inset,
        0 30px 60px rgba(15,23,42,.08);
    }
    .icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: grid; place-items: center;
      background: #ecfdf5;
      color: var(--accent);
      font-size: 22px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-family: Satoshi, Inter, sans-serif;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    .sub {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14.5px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap span {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 15px;
    }
    input {
      width: 100%;
      height: 50px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 0 14px 0 40px;
      font: inherit;
      font-size: 15px;
      outline: none;
      background: #fff;
    }
    input:focus {
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17,24,39,.08);
    }
    .btn {
      margin-top: 14px;
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .divider {
      height: 1px;
      background: var(--line);
      margin: 20px 0 16px;
    }
    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .meta div {
      text-align: center;
      padding: 12px 8px;
      border-radius: 12px;
      background: #f9fafb;
      border: 1px solid #f3f4f6;
    }
    .meta strong {
      display: block;
      font-size: 13px;
      margin-bottom: 2px;
    }
    .meta small {
      color: var(--muted);
      font-size: 11px;
    }
    .foot {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.5;
    }
    .badge {
      position: fixed;
      top: 14px; right: 14px;
      background: #111827; color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 5px 9px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="badge">D · Trust card</div>
  <main class="frame">
    <div class="card">
      <div class="icon">📦</div>
      <h1>查找订单</h1>
      <p class="sub">输入下单邮箱，查看该邮箱下的全部订单。适合未登录的访客快速取回订单与激活信息。</p>
      <label for="email">下单邮箱</label>
      <div class="input-wrap">
        <span>✉</span>
        <input id="email" type="email" placeholder="下单时填写的邮箱" />
      </div>
      <button class="btn" type="button">查询订单</button>
      <div class="divider"></div>
      <div class="meta">
        <div><strong>隐私</strong><small>仅本邮箱可见</small></div>
        <div><strong>速度</strong><small>秒级返回</small></div>
        <div><strong>完整</strong><small>含物流 / eSIM</small></div>
      </div>
      <p class="foot">登录用户也可在「我的订单」中查看全部历史记录。</p>
    </div>
  </main>
</body>
</html>
