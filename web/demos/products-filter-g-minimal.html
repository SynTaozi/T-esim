<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo G — 极简目录（参考 Stripe/Linear 式收敛）</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--accent:#003ec7;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#fafafa}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
    .banner{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 18px;background:#0f172a;color:#cbd5e1;font-size:13px}
    .banner a{color:#94a3b8;text-decoration:none;padding:4px 10px;border-radius:999px}.banner a.active,.banner a:hover{color:#fff;background:var(--accent)}
    .banner nav{display:flex;flex-wrap:wrap;gap:6px}
    .wrap{max-width:980px;margin:0 auto;padding:36px 20px 80px}
    h1{margin:0 0 6px;font:800 34px/1.15 Manrope,system-ui}
    .sub{margin:0 0 28px;color:var(--muted)}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
    .seg{display:inline-flex;padding:3px;border-radius:10px;background:#eee;border:1px solid var(--line)}
    .seg button{border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font:600 13px Inter}
    .seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
    .search{position:relative}
    .search input{width:240px;max-width:70vw;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px 0 36px;background:#fff;font:inherit}
    .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:#9ca3af}
    .filters{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
    .filters button{border:0;background:transparent;padding:0;cursor:pointer;color:var(--muted);font:500 13px Inter}
    .filters button.active{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:5px}
    .count{margin:0 0 14px;font-size:13px;color:var(--muted)}
    .list{display:flex;flex-direction:column;gap:10px}
    .item{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px}
    .item:hover{border-color:#c7d2fe}
    .icon{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:#eff2ff}
    .item h3{margin:0 0 4px;font-size:15px}
    .item p{margin:0;color:var(--muted);font-size:12px}
    .right{text-align:right}
    .price{font-weight:800}
    .go{margin-top:6px;display:inline-block;font-size:12px;font-weight:700;color:var(--accent)}
    @media(max-width:640px){.item{grid-template-columns:48px 1fr}.right{grid-column:2}}
  </style>
</head>
<body>
  <div class="banner">
    <div><strong style="color:#fff">Demo G</strong> · 极简目录（分段切换 + 文字筛选，无侧栏无大 chip 墙）</div>
    <nav>
      <a href="index.html">Index</a>
      <a href="products-filter-d-airalo.html">D Airalo</a>
      <a href="products-filter-e-nomad.html">E Nomad</a>
      <a href="products-filter-f-holafly.html">F Holafly</a>
      <a class="active" href="products-filter-g-minimal.html">G Minimal</a>
    </nav>
  </div>
  <div class="wrap">
    <h1>Products</h1>
    <p class="sub">把筛选压到「类型分段 + 一行文字过滤」，适合同时卖号码和流量。</p>
    <div class="toolbar">
      <div class="seg" id="seg"></div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input id="q" placeholder="Search" />
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <p class="count" id="count"></p>
    <div class="list" id="list"></div>
  </div>
  <script>
    const types=[{id:'phone',name:'Phone numbers'},{id:'esim',name:'Data eSIM'}];
    const filters={
      phone:['All','SMS','Voice','Long-term'],
      esim:['All','Asia','Europe','Global']
    };
    const items=[
      {type:'phone',f:'SMS',name:'Japan SMS number',flag:'🇯🇵',desc:'30 days · inbound SMS',price:9.9},
      {type:'phone',f:'Voice',name:'Hong Kong voice',flag:'🇭🇰',desc:'30 days · voice + SMS',price:12.5},
      {type:'phone',f:'Long-term',name:'US long-term number',flag:'🇺🇸',desc:'Monthly renewal',price:19},
      {type:'esim',f:'Asia',name:'Japan 7-day 3GB',flag:'🇯🇵',desc:'Local data',price:6.5},
      {type:'esim',f:'Europe',name:'Europe 15-day 10GB',flag:'🇪🇺',desc:'Multi-country',price:14},
      {type:'esim',f:'Global',name:'Global 30-day 20GB',flag:'🌍',desc:'Worldwide',price:29}
    ];
    let type='phone', filter='All', q='';
    function render(){
      document.getElementById('seg').innerHTML=types.map(t=>`<button class="${t.id===type?'active':''}" data-t="${t.id}">${t.name}</button>`).join('');
      document.getElementById('seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{type=b.dataset.t;filter='All';render();});
      document.getElementById('filters').innerHTML=filters[type].map(f=>`<button class="${f===filter?'active':''}" data-f="${f}">${f}</button>`).join('');
      document.getElementById('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();});
      const list=items.filter(i=>{
        if(i.type!==type) return false;
        if(filter!=='All' && i.f!==filter) return false;
        if(q && !i.name.toLowerCase().includes(q)) return false;
        return true;
      });
      document.getElementById('count').textContent=`${list.length} products`;
      document.getElementById('list').innerHTML=list.map(i=>`
        <article class="item">
          <div class="icon">${i.flag}</div>
          <div><h3>${i.name}</h3><p>${i.desc}</p></div>
          <div class="right"><div class="price">$${i.price}</div><span class="go">View →</span></div>
        </article>`).join('') || '<p style="color:#6b7280">No products</p>';
    }
    document.getElementById('q').oninput=e=>{q=e.target.value.trim().toLowerCase();render();};
    render();
  </script>
</body>
</html>
