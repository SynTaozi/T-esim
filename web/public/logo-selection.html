<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo 选择</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #fff;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 28px;
      color: #e11d48;
    }
    .logo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .logo-card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      border: 2px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    .logo-card:hover {
      border-color: #e11d48;
      transform: translateY(-5px);
    }
    .logo-number {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
    }
    .logo-preview {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }
    .logo-name {
      font-size: 16px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>请选择你喜欢的 Logo 设计</h1>
  
  <div class="logo-grid">
    <!-- Logo 1 -->
    <div class="logo-card">
      <div class="logo-number">设计 1</div>
      <div class="logo-preview">
        <svg viewBox="0 0 40 40" width="60" height="60" fill="none">
          <defs>
            <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#e11d48"/>
              <stop offset="100%" style="stop-color:#7c3aed"/>
            </linearGradient>
          </defs>
          <rect x="4" y="8" width="32" height="24" rx="4" fill="url(#g1)"/>
          <rect x="8" y="14" width="24" height="12" rx="2" fill="white" opacity="0.9"/>
          <rect x="11" y="17" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="17" y="17" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="23" y="17" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="11" y="21" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="17" y="21" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="23" y="21" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <circle cx="20" cy="8" r="2" fill="url(#g1)"/>
        </svg>
      </div>
      <div class="logo-name">SIM卡芯片带触点</div>
    </div>

    <!-- Logo 2 -->
    <div class="logo-card">
      <div class="logo-number">设计 2</div>
      <div class="logo-preview">
        <svg viewBox="0 0 40 40" width="60" height="60" fill="none">
          <defs>
            <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#e11d48"/>
              <stop offset="100%" style="stop-color:#7c3aed"/>
            </linearGradient>
          </defs>
          <rect x="4" y="8" width="32" height="24" rx="4" fill="url(#g2)"/>
          <rect x="8" y="14" width="24" height="12" rx="2" fill="white" opacity="0.9"/>
          <rect x="11" y="17" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="17" y="17" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="23" y="17" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="11" y="21" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="17" y="21" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="23" y="21" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <path d="M36 20 Q38 12 36 4" stroke="white" stroke-width="1.5" fill="none"/>
          <path d="M32 20 Q34 14 32 8" stroke="white" stroke-width="1.5" fill="none"/>
          <path d="M28 20 Q30 16 28 12" stroke="white" stroke-width="1.5" fill="none"/>
        </svg>
      </div>
      <div class="logo-name">SIM卡带信号波</div>
    </div>

    <!-- Logo 3 -->
    <div class="logo-card">
      <div class="logo-number">设计 3</div>
      <div class="logo-preview">
        <svg viewBox="0 0 40 40" width="60" height="60" fill="none">
          <defs>
            <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#e11d48"/>
              <stop offset="100%" style="stop-color:#7c3aed"/>
            </linearGradient>
          </defs>
          <rect x="4" y="8" width="32" height="24" rx="4" fill="url(#g3)"/>
          <rect x="8" y="14" width="24" height="12" rx="2" fill="white" opacity="0.9"/>
          <rect x="11" y="17" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="17" y="17" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="23" y="17" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="11" y="21" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="17" y="21" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <rect x="23" y="21" width="4" height="2" rx="0.5" fill="#7c3aed"/>
          <circle cx="20" cy="8" r="2" fill="url(#g3)"/>
          <circle cx="20" cy="8" r="4" stroke="url(#g3)" stroke-width="1" fill="none"/>
        </svg>
      </div>
      <div class="logo-name">SIM卡带圆形</div>
    </div>

    <!-- Logo 4 -->
    <div class="logo-card">
      <div class="logo-number">设计 4</div>
      <div class="logo-preview">
        <svg viewBox="0 0 40 40" width="60" height="60" fill="none">
          <defs>
            <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#e11d48"/>
              <stop offset="100%" style="stop-color:#7c3aed"/>
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="10" fill="url(#g4)"/>
          <rect x="8" y="10" width="24" height="20" rx="3" stroke="white" stroke-width="1.5" fill="none"/>
          <rect x="11" y="13" width="5" height="3" rx="1" fill="white"/>
          <rect x="11" y="18" width="5" height="3" rx="1" fill="white"/>
          <rect x="11" y="23" width="5" height="3" rx="1" fill="white"/>
          <rect x="24" y="13" width="5" height="3" rx="1" fill="white"/>
          <rect x="24" y="18" width="5" height="3" rx="1" fill="white"/>
          <rect x="24" y="23" width="5" height="3" rx="1" fill="white"/>
        </svg>
      </div>
      <div class="logo-name">芯片触点阵列</div>
    </div>

    <!-- Logo 5 -->
    <div class="logo-card">
      <div class="logo-number">设计 5</div>
      <div class="logo-preview">
        <svg viewBox="0 0 40 40" width="60" height="60" fill="none">
          <defs>
            <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#e11d48"/>
              <stop offset="100%" style="stop-color:#7c3aed"/>
            </linearGradient>
          </defs>
          <circle cx="20" cy="20" r="18" fill="url(#g5)"/>
          <rect x="12" y="12" width="16" height="16" rx="3" fill="white"/>
          <rect x="14" y="14" width="12" height="12" rx="2" fill="url(#g5)"/>
          <circle cx="17" cy="17" r="1.5" fill="white"/>
          <circle cx="23" cy="17" r="1.5" fill="white"/>
          <circle cx="17" cy="23" r="1.5" fill="white"/>
          <circle cx="23" cy="23" r="1.5" fill="white"/>
          <path d="M28 12 Q32 20 28 28" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M31 9 Q36 20 31 31" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
        </svg>
      </div>
      <div class="logo-name">圆形eSIM带信号</div>
    </div>

    <!-- Logo 6 -->
    <div class="logo-card">
      <div class="logo-number">设计 6</div>
      <div class="logo-preview">
        <svg viewBox="0 0 40 40" width="60" height="60" fill="none">
          <defs>
            <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#e11d48"/>
              <stop offset="100%" style="stop-color:#7c3aed"/>
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="10" fill="url(#g6)"/>
          <path d="M20 12 L32 28 L8 28 Z" stroke="white" stroke-width="2" fill="none"/>
          <circle cx="20" cy="21" r="4" fill="white"/>
        </svg>
      </div>
      <div class="logo-name">三角形信号塔</div>
    </div>

    <!-- Logo 7 -->
    <div class="logo-card">
      <div class="logo-number">设计 7</div>
      <div class="logo-preview">
        <svg viewBox="0 0 40 40" width="60" height="60" fill="none">
          <defs>
            <linearGradient id="g7" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#e11d48"/>
              <stop offset="100%" style="stop-color:#7c3aed"/>
            </linearGradient>
          </defs>
          <circle cx="20" cy="20" r="18" fill="url(#g7)"/>
          <text x="20" y="26" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Arial">e</text>
        </svg>
      </div>
      <div class="logo-name">圆形e字母</div>
    </div>

    <!-- Logo 8 -->
    <div class="logo-card">
      <div class="logo-number">设计 8</div>
      <div class="logo-preview">
        <svg viewBox="0 0 40 40" width="60" height="60" fill="none">
          <defs>
            <linearGradient id="g8" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#e11d48"/>
              <stop offset="100%" style="stop-color:#7c3aed"/>
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="10" fill="url(#g8)"/>
          <rect x="8" y="8" width="24" height="24" rx="4" stroke="white" stroke-width="2" fill="none"/>
          <line x1="8" y1="20" x2="32" y2="20" stroke="white" stroke-width="2"/>
          <line x1="20" y1="8" x2="20" y2="32" stroke="white" stroke-width="2"/>
        </svg>
      </div>
      <div class="logo-name">网格定位</div>
    </div>

    <!-- Logo 9 -->
    <div class="logo-card">
      <div class="logo-number">设计 9</div>
      <div class="logo-preview">
        <svg viewBox="0 0 40 40" width="60" height="60" fill="none">
          <defs>
            <linearGradient id="g9" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#e11d48"/>
              <stop offset="100%" style="stop-color:#7c3aed"/>
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="10" fill="url(#g9)"/>
          <circle cx="20" cy="20" r="8" stroke="white" stroke-width="2" fill="none"/>
          <circle cx="20" cy="20" r="3" fill="white"/>
          <line x1="20" y1="8" x2="20" y2="12" stroke="white" stroke-width="2"/>
          <line x1="20" y1="28" x2="20" y2="32" stroke="white" stroke-width="2"/>
          <line x1="8" y1="20" x2="12" y2="20" stroke="white" stroke-width="2"/>
          <line x1="28" y1="20" x2="32" y2="20" stroke="white" stroke-width="2"/>
        </svg>
      </div>
      <div class="logo-name">定位圆点</div>
    </div>

    <!-- Logo 10 -->
    <div class="logo-card">
      <div class="logo-number">设计 10</div>
      <div class="logo-preview">
        <svg viewBox="0 0 40 40" width="60" height="60" fill="none">
          <defs>
            <linearGradient id="g10" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#e11d48"/>
              <stop offset="100%" style="stop-color:#7c3aed"/>
            </linearGradient>
          </defs>
          <path d="M20 4 L36 20 L20 36 L4 20 Z" fill="url(#g10)"/>
          <path d="M20 10 L30 20 L20 30 L10 20 Z" stroke="white" stroke-width="2" fill="none"/>
          <circle cx="20" cy="20" r="3" fill="white"/>
        </svg>
      </div>
      <div class="logo-name">菱形芯片</div>
    </div>

  </div>
</body>
</html>
