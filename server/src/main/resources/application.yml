server:
  port: 8088
  servlet:
    context-path: /api

spring:
  application:
    name: t-esim
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

tesim:
  upload:
    dir: uploads
    public-path: /uploads
    max-bytes: 5242880
  jwt:
    secret: tesim-dev-jwt-secret-change-me-32bytes-min
    expire-hours: 168
  payment:
    usdt:
      address: TXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      rate: 1
    stripe:
      # 勿把真实 sk_/whsec_ 写入仓库；本地/服务器用环境变量注入
      api-key: ${TESIM_STRIPE_API_KEY:}
      webhook-secret: ${TESIM_STRIPE_WEBHOOK_SECRET:}
      success-url: http://localhost:5173/checkout/stripe/success
      cancel-url: http://localhost:5173/checkout/stripe/cancel
      currency: usd

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.tesim.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: info
    com.tesim: debug
